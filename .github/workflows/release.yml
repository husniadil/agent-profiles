name: Release

on:
  push:
    tags: ["v*"]
  # Rehearses the whole matrix without publishing anything: the release inputs
  # below are supplied only on a tag push, and with none of them set the action
  # builds every bundle and then skips all uploads. The bundles come back as
  # workflow artifacts, which expire on their own.
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One artifact for both Apple chips. Two separate downloads would mostly
          # teach people to pick the wrong one; most users do not know their chip.
          - name: macOS (Intel + Apple Silicon)
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust-targets: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      # Pinned to a commit, so `stable` can no longer be read from the ref name —
      # name the toolchain explicitly instead.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 'stable' branch, pinned
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # No version pinned here: the action reads `packageManager` from
      # package.json, so CI installs the pnpm the repo declares rather than a
      # number that has to be remembered in two places.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing for the updater, which is a minisign keypair and nothing to
          # do with OS code signing — the bundles stay unsigned, and the release
          # notes above still say so. Without these the build succeeds and
          # produces artifacts no installed copy will accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # This is the switch between publishing and rehearsing. On a tag push
          # it is the tag; on `workflow_dispatch` it is empty, and the action
          # builds everything and then skips all uploads instead of opening a
          # draft release named after the branch it was dispatched from. Every
          # release input below is inert without it.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: Agent Profiles ${{ github.ref_name }}
          # Every artifact here is unsigned, so say so where people download it
          # rather than letting the OS tell them the app is "damaged".
          releaseBody: |
            Unsigned builds. Your operating system will object, and its wording is misleading.

            - **macOS** may say the app "is damaged". It is not — it is unsigned. Right-click the app and choose **Open**.
            - **Windows** shows a SmartScreen warning. Choose **More info → Run anyway**.

            Only trust builds downloaded from this page.

            **Windows and Linux are unverified**: see the platform checklists in `docs/platform-status.md`. Reports from those platforms are very welcome.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Only on a rehearsal, where there is no release to hold the bundles.
          # A tag push has one, and uploading twice would just cost bandwidth.
          uploadWorkflowArtifacts: ${{ github.event_name != 'push' }}
          # The manifest the updater reads. Same switch as every other release
          # input: inert on a `workflow_dispatch` rehearsal, because `tagName` is
          # empty there and the action skips all uploads.
          uploadUpdaterJson: true
