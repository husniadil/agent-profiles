[package]
name = "agent-profiles"
version = "0.2.0"
description = "A tray app for managing Claude Desktop profiles"
authors = ["Husni Adil Makmur <husni.adil@gmail.com>"]
license = "MIT"
repository = "https://github.com/husniadil/agent-profiles"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_profiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
uuid = { version = "1.24.0", features = ["v4"] }
tauri-plugin-autostart = "2.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSRunningApplication",
  # The tray menu's type size is set through AppKit directly; muda's menu item
  # takes a plain `String` and has nowhere to put a font.
  "NSAttributedString",
  "NSFont",
  "NSMenu",
  "NSMenuItem",
  "NSStatusItem",
] }
objc2-foundation = { version = "0.3.2", features = ["NSAttributedString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
] }
