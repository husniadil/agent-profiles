<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- `--canvas`, which is what `body` paints. -->
    <meta name="theme-color" content="#dddfe2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
    <title>Agent Profiles</title>
    <link rel="icon" type="image/png" href="/src/favicon.png" />
  </head>
  <body>
    <main class="container">
      <header class="status-line">
        <p id="status" aria-live="polite">0 profiles · 0 running</p>
        <!-- The path lives in a `bdi` so it keeps its own left-to-right ordering
             inside a right-to-left box. The box is right-to-left so the ellipsis
             eats the start of the path rather than the meaningful tail. -->
        <p id="data-root" title=""><span class="sr-only">Profiles folder: </span><bdi></bdi></p>
      </header>

      <section class="profiles-section" aria-label="Profiles">
        <div id="error" class="error" role="alert" hidden></div>
        <div id="apps" aria-live="polite"></div>
      </section>

      <section class="add-section" aria-labelledby="add-heading">
        <h2 id="add-heading" class="app-heading">Add a profile</h2>
        <div class="add-column">
          <form id="add-profile-form" class="add-form">
            <span class="app-picker" hidden>
              <label class="sr-only" for="new-app">App</label>
              <select id="new-app" name="app"></select>
            </span>
            <label class="sr-only" for="new-label">Profile label</label>
            <input id="new-label" name="label" type="text" maxlength="80" autocomplete="off" placeholder="e.g. Work" required />
            <button type="submit" class="button button-primary">Add profile</button>
          </form>
          <!-- Refusals belong beside the control that caused them. This one used
               to render in the banner at the top of the page, far enough above
               the form to be off screen, so a rejected label looked like a
               button that did nothing. -->
          <div id="add-error" class="error error-inline" role="alert" hidden></div>
          <div id="budget" class="budget" hidden>
            <p id="budget-path" class="budget-path"></p>
            <div class="budget-bar"><span id="budget-fill"></span></div>
            <p class="budget-legend">
              <span id="budget-note"></span>
              <span id="budget-count"></span>
            </p>
            <!-- Over budget means no profile can be created on this machine at
                 all, which is too important to leave as a colour change nobody
                 is looking at. The visible legend says it in place; this says it
                 out loud, and only in the case that warrants interrupting. -->
            <p id="budget-alert" class="sr-only" role="alert"></p>
          </div>
        </div>
      </section>
      <section class="settings-section" id="autostart-section" aria-labelledby="settings-heading" hidden>
        <div>
          <p class="eyebrow">Startup</p>
          <h2 id="settings-heading">Launch at login</h2>
          <p class="helper">Start Agent Profiles automatically when you sign in. This only starts the tray; no profile is opened for you.</p>
        </div>
        <label class="toggle-row">
          <input id="autostart" type="checkbox" />
          <span>Start Agent Profiles at login</span>
        </label>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
