<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Agent Profiles">
  <!-- The same mark as the menu bar tray icon, filled in: two stacked profile
       cards drawn as outlines, with the concave four-point sparkle that reads
       as AI across the field sitting on the front card. The cards say
       profiles, the sparkle says agent — and the dock and the menu bar now
       show the same thing rather than a lettermark and a drawing.

       Outlines rather than solid cards: a solid card behind a solid card at
       this scale is one orange blob with a seam, and the seam is the first
       thing to vanish when the icon is scaled down.

       The card behind is cut away around the front one instead of simply
       overlapping it — two touching outlines merge into a single shape at
       small sizes, and the gap is what keeps them reading as two.

       Cards plus stroke span 215–809 on both axes, so the mark is centred on
       the canvas, same as the small variant. -->
  <!-- ponytail: full-bleed square, no inset and no corner radius of our own.
       macOS 26 masks app icons to the system squircle; drawing our own
       smaller rounded square left the system's light plate showing as a
       white rim around it. Let the platform do the shaping. -->
  <rect width="1024" height="1024" fill="#dd6b32"/>
  <mask id="behind">
    <rect width="1024" height="1024" fill="#fff"/>
    <rect x="215" y="391" width="472" height="472" rx="132" fill="#000"/>
  </mask>
  <g fill="none" stroke="#fffaf2" stroke-width="52">
    <rect x="391" y="215" width="392" height="392" rx="104" mask="url(#behind)"/>
    <rect x="241" y="417" width="392" height="392" rx="104"/>
  </g>
  <path d="M 437 499 Q 471 584 557 619 Q 471 653 437 739 Q 403 653 317 619 Q 403 584 437 499 Z" fill="#fffaf2"/>
</svg>
