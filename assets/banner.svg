<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Agent Profiles — run your coding agents in parallel, one profile each">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3050"/>
      <stop offset="60%" stop-color="#192c46"/>
      <stop offset="100%" stop-color="#14243a"/>
    </linearGradient>
    <!-- Radial, not linear: a linear fade inside a circle still leaves a hard
         rim, which reads as a disc rather than light. -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dd6b32" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#dd6b32" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#dd6b32" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="1120" cy="90" r="380" fill="url(#glow)"/>

  <!-- Brand mark: the app and tray icon, unchanged — two stacked profile
       cards carrying the AI sparkle, on the orange tile. -->
  <g transform="translate(96 126) scale(0.146)">
    <rect x="32" y="32" width="960" height="960" rx="220" fill="#dd6b32"/>
    <mask id="behind">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="228" y="404" width="472" height="472" rx="132" fill="#000"/>
    </mask>
    <g fill="none" stroke="#fffaf2" stroke-width="52">
      <rect x="404" y="228" width="392" height="392" rx="104" mask="url(#behind)"/>
      <rect x="254" y="430" width="392" height="392" rx="104"/>
    </g>
    <path d="M 450 512 Q 484 597 570 632 Q 484 666 450 752 Q 416 666 330 632 Q 416 597 450 512 Z" fill="#fffaf2"/>
  </g>

  <text x="266" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#f4f0e8" letter-spacing="-2">Agent Profiles</text>
  <text x="270" y="196" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-size="26" fill="#a9b6c8">Run your coding agents side by side — one profile each.</text>

  <!-- A miniature of the tray menu: the filled dot means that profile is live. -->
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="21">
    <rect x="268" y="240" width="196" height="46" rx="8" fill="#ffffff" opacity="0.06"/>
    <text x="290" y="270" fill="#dd6b32">●</text>
    <text x="316" y="270" fill="#f4f0e8">Work</text>

    <rect x="480" y="240" width="212" height="46" rx="8" fill="#ffffff" opacity="0.06"/>
    <text x="502" y="270" fill="#dd6b32">●</text>
    <text x="528" y="270" fill="#f4f0e8">Personal</text>

    <rect x="708" y="240" width="204" height="46" rx="8" fill="#ffffff" opacity="0.06"/>
    <text x="730" y="270" fill="#6d7c92">○</text>
    <text x="756" y="270" fill="#a9b6c8">Default</text>
  </g>

  <text x="270" y="336" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-size="17" fill="#7d8b9e" letter-spacing="1.5">MACOS · WINDOWS · LINUX &#160;&#160;•&#160;&#160; TAURI + RUST &#160;&#160;•&#160;&#160; MIT</text>
</svg>
